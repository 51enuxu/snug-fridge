<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>我们的冰箱</title>
  <meta name="description" content="冰箱网页版：开门、贴贴纸、贴便签、贴照片，纯静态可玩预览">
  <link rel="stylesheet" href="css/fridge.css">
  <!-- PWA：可以「添加到主屏幕」，全屏打开，第一次打开后没网也能玩 -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="theme-color" content="#F8ECDE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="冰箱">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="top-btn" id="backBtn" title="返回" onclick="history.length > 1 ? history.back() : null"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="top-title"><div class="t1">我们的冰箱</div><div class="t2">FRIDGE</div></div>
      <button class="top-btn" id="menuBtn" title="更多"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </header>
    <div class="viewport" id="viewport"></div>
    <div class="controls" id="controls">
      <div class="hint" id="hint"></div>
      <div class="pills" id="pills"></div>
    </div>
  </div>
  <script src="js/data.js"></script>
  <script src="js/anim.js"></script>
  <script src="js/views.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
